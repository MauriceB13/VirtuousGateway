name: Offline .NET tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.403

      - name: Restore test project
        run: dotnet restore tests/VirtuousGateway.Tests/VirtuousGateway.Tests.csproj

      - name: Build test project
        run: dotnet build tests/VirtuousGateway.Tests/VirtuousGateway.Tests.csproj --configuration Release --no-restore

      - name: Run focused unit tests
        run: dotnet test tests/VirtuousGateway.Tests/VirtuousGateway.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~AplosApiClientTests|FullyQualifiedName~VirtuousGiftServiceTests"
